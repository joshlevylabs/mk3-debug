name: Build Release

on:
  # Trigger on version tags
  push:
    tags:
      - 'v*'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub release'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: MK3_Diagnostic_Tool.exe
            asset_name: MK3_Diagnostic_Tool_Windows.exe
          - os: macos-latest
            artifact_name: MK3_Diagnostic_Tool.app
            asset_name: MK3_Diagnostic_Tool_macOS
          - os: ubuntu-latest
            artifact_name: MK3_Diagnostic_Tool
            asset_name: MK3_Diagnostic_Tool_Linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable
        run: python build.py --clean

      - name: List dist contents
        run: ls -laR dist/
        shell: bash

      # --- macOS Code Signing & Notarization ---
      - name: Import Apple certificate
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create a temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Sign macOS app bundle
        if: matrix.os == 'macos-latest' && env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_PATH="dist/MK3_Diagnostic_Tool.app"

          # Sign all nested binaries and libraries first (deep sign)
          codesign --force --options runtime --deep \
            --sign "Developer ID Application: Josh Levy Labs Inc. (${{ secrets.APPLE_TEAM_ID }})" \
            --timestamp \
            "$APP_PATH"

          # Verify the signature
          codesign --verify --verbose=2 --deep "$APP_PATH"

      - name: Notarize macOS app bundle
        if: matrix.os == 'macos-latest' && env.APPLE_CERTIFICATE_BASE64 != ''
        continue-on-error: true
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          APP_PATH="dist/MK3_Diagnostic_Tool.app"

          # Create a zip for notarization submission
          ditto -c -k --keepParent "$APP_PATH" dist/MK3_Diagnostic_Tool_notarize.zip

          # Submit for notarization and wait (timeout after 30 min)
          timeout 1800 xcrun notarytool submit dist/MK3_Diagnostic_Tool_notarize.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait || echo "::warning::Notarization timed out or failed — app is signed but not notarized"

          # Staple the notarization ticket (if available)
          xcrun stapler staple "$APP_PATH" || echo "::warning::Stapling skipped — notarization may not have completed"

          # Clean up
          rm -f dist/MK3_Diagnostic_Tool_notarize.zip
      # --- End macOS Code Signing ---

      # macOS: zip the .app bundle for upload (preserves bundle structure)
      - name: Package macOS app
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip -r -y MK3_Diagnostic_Tool_macOS.zip MK3_Diagnostic_Tool.app
          cd ..

      - name: Upload artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error

      - name: Upload artifact (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/MK3_Diagnostic_Tool_macOS.zip
          if-no-files-found: error

      - name: Upload artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: MK3_Diagnostic_Tool_Windows.exe
          path: release/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: MK3_Diagnostic_Tool_macOS
          path: release/

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: MK3_Diagnostic_Tool_Linux
          path: release/

      - name: Prepare release artifacts
        run: |
          # Windows - rename
          mv release/MK3_Diagnostic_Tool.exe release/MK3_Diagnostic_Tool_Windows.exe || true

          # macOS - already zipped as .app bundle
          # The zip was created in the build step, just verify it's here
          ls -la release/MK3_Diagnostic_Tool_macOS.zip

          # Linux - rename and make executable
          mv release/MK3_Diagnostic_Tool release/MK3_Diagnostic_Tool_Linux || true
          chmod +x release/MK3_Diagnostic_Tool_Linux || true

          ls -la release/

      - name: Get version from tag
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=manual-build" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: MK3 Diagnostic Tool ${{ steps.get_version.outputs.version }}
          body: |
            ## MK3 Amplifier Network Diagnostic Tool

            ### Downloads
            | Platform | File | Notes |
            |----------|------|-------|
            | **Windows** | `MK3_Diagnostic_Tool_Windows.exe` | Run directly. If SmartScreen warns, click "More info" > "Run anyway" |
            | **macOS** | `MK3_Diagnostic_Tool_macOS.zip` | Unzip to get `MK3 Diagnostic Tool.app` — double-click to run |
            | **Linux** | `MK3_Diagnostic_Tool_Linux` | `chmod +x` then run from terminal |

            ### What This Tool Does
            - Discovers MK3 amplifiers on your network via mDNS/Bonjour
            - Tests TCP connectivity to amplifier control port (52000)
            - Sends diagnostic commands and displays real-time device status
            - Generates diagnostic reports to help troubleshoot network issues

            ### Supported Models
            - DSP 8-130 MK3
            - DSP 2-750 MK3
            - DSP 2-150 MK3
          draft: false
          prerelease: false
          files: |
            release/MK3_Diagnostic_Tool_Windows.exe
            release/MK3_Diagnostic_Tool_macOS.zip
            release/MK3_Diagnostic_Tool_Linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
